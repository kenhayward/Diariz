# Trust the outer TLS-terminating proxy's scheme. This container is reached over plain http from that proxy,
# so `$scheme` here is always "http" - forwarding that to the API would make it (and OpenIddict) think the
# request arrived over http, which breaks the OAuth endpoints ("this server only accepts HTTPS requests") and
# any https-derived URL/cookie. Prefer the incoming X-Forwarded-Proto (set by the outer proxy, e.g. "https");
# fall back to $scheme only when there is no outer proxy (direct http access in local compose).
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large audio uploads (matches the API's 1 GiB RequestSizeLimit). nginx defaults to
    # 1 MB, which otherwise rejects recordings over ~1 MB with 413 before they reach the API.
    client_max_body_size 1024m;

    # Platform backup & restore — the two endpoints that break every assumption the block below makes, so
    # they get their own (longer-prefix, therefore winning) location.
    #
    # SIZE: a restore body is a whole platform in one request - the pg_dump plus every stored blob, held
    # uncompressed - so it is by definition larger than the sum of all recordings and has no meaningful
    # ceiling. Capping it at the 1024m above rejected a legitimate restore with a bare nginx 413 (the API
    # itself has none: the action is `[DisableRequestSizeLimit]` and Platform-Administrator-only). `0`
    # disables the check for this path only; every other endpoint keeps the 1024m ceiling.
    #
    # TIME: neither endpoint sends or receives anything for minutes. Backup builds the whole zip before the
    # first response byte; restore reloads the database and re-uploads every blob before it answers. nginx's
    # 60s default surfaces that as a 504 - which reads as a crash, not as "still working".
    #
    # BUFFERING: pass the body straight through rather than caching it. Left on (the default), nginx spools
    # the whole archive to client_body_temp_path before forwarding a byte - scratch space equal to the archive
    # on this container's writable layer, and double the wall-clock, since the API then writes its own temp
    # copy regardless. Two less obvious reasons the usual "buffering shields the upstream" argument inverts
    # here: with an unlimited body size, buffering makes nginx absorb an *unauthenticated* flood to its own
    # disk before the API can answer 401 (the action doesn't touch Request.Body until after authorization);
    # and buffering is what lets nginx retry against another upstream, which is the last thing a destructive,
    # non-idempotent restore should do. A dropped connection mid-upload is safe: the API gets a truncated zip,
    # which fails to open before pg_restore or the bucket wipe run.
    #
    # proxy_http_version 1.1 is REQUIRED for the above, not decoration: nginx buffers a chunked request body
    # regardless of proxy_request_buffering unless HTTP/1.1 is enabled for proxying, and the default is 1.0.
    # A browser sends Content-Length so it would stream anyway - but an outer proxy streaming into this one
    # arrives chunked, and would then be spooled to disk here silently.
    location /api/maintenance/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3h;
        proxy_send_timeout 3h;
    }

    # REST API — forwarded unchanged to the API container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # SignalR hub — needs WebSocket upgrade and long-lived connections.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # MCP server (Streamable HTTP) — forwarded to the API. Responses stream as text/event-stream,
    # so response buffering must be off or the SSE stream stalls (no WebSocket upgrade needed).
    # X-Forwarded-Proto lets the MCP link-rewriter emit correct absolute https:// deep-links.
    location /mcp {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # OAuth 2.1 authorization server (for the claude.ai web MCP connector): the OpenIddict endpoints
    # (/connect/authorize, /connect/token) + the hand-rolled DCR endpoint (/connect/register), and the
    # discovery/metadata documents (/.well-known/openid-configuration, /.well-known/oauth-authorization-server,
    # /.well-known/oauth-protected-resource). These are served by the API and MUST be forwarded to it - without
    # this, an OAuth client fetching them would get the SPA index.html instead. X-Forwarded-Proto MUST reflect
    # the public https scheme (OpenIddict rejects non-https requests). NOTE: /oauth/consent is a SPA route and
    # is deliberately NOT proxied here - it stays on the client-side fallback below.
    location /connect/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
    location /.well-known/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Vite's build output is content-hashed (index-ByvndAe2.js): the filename changes whenever the bytes do,
    # so these can be cached hard and forever. A client that has them never asks for them again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell, in contrast, must be revalidated on every load - it is the file that NAMES the hashed
    # bundles above, so a stale copy pins the client to the whole of the previous build.
    #
    # Without an explicit directive nginx sends only ETag/Last-Modified, and a cache is then free to apply
    # *heuristic* freshness (RFC 9111 4.2.2): Chromium reuses the HTML for a fraction of its age without
    # asking. A redeploy therefore left clients running the old app - most visibly the desktop shell, which
    # loads the SPA from this origin and which people leave open for days, so it never got a fresh document
    # and no amount of redeploying reached it. `no-cache` does not stop it being cached, it only forces the
    # revalidation, so the usual answer is a 304 on about a kilobyte.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA client-side routing fallback. `try_files`'s last argument is an internal redirect, so a deep route
    # re-enters location matching and picks up the exact-match block above - the fallback document carries the
    # same no-cache header as a direct hit on /index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
