# Diariz: record system audio on Linux.
#
# Install to ONE of these, then run:  systemctl --user restart pipewire
#
#   ~/.config/pipewire/pipewire.conf.d/     just you (no root needed)
#   /etc/pipewire/pipewire.conf.d/          every user on this machine (needs root)
#
# WHY THIS IS NEEDED
# Chromium on Linux does not capture system audio when you share a screen or a window - only when you
# share a browser tab. The way around that is to record what your speakers are playing as if it were a
# microphone. PipeWire can do this, but it does not publish a speaker's "monitor" as a device of its own,
# so browsers have nothing to list. This file publishes it as a real input device called
# "System Audio (Diariz)", which then appears in the microphone dropdown.
#
# @DEFAULT_AUDIO_SINK@ means it follows your current output, so it keeps working when you switch between
# speakers, headphones and HDMI. node.passive keeps it idle until something actually records from it.
#
# IF THE RECORDING COMES OUT SILENT
# Turn OFF "Echo cancellation" in Diariz's capture tuning (it is off by default). An echo canceller exists
# to remove sound coming from your own speakers - which, when recording system audio, is the entire
# recording. It lets the first second or two through and then silences the rest.
#
# NOTE: this device is visible to every application, not just Diariz - Zoom, Teams and Slack will list it
# as a microphone too.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "System Audio (Diariz)"
      capture.props = {
        stream.capture.sink = true
        node.target         = "@DEFAULT_AUDIO_SINK@"
        node.passive        = true
      }
      playback.props = {
        media.class      = "Audio/Source"
        node.name        = "diariz_system_audio"
        node.description = "System Audio (Diariz)"
      }
    }
  }
]
