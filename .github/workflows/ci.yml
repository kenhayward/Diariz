name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; cancel superseded runs so stale pushes don't keep burning runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet-unit:
    name: .NET unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No global.json, so pin the SDK explicitly. setup-dotnet installs into the hosted
      # runner's tool cache — the self-hosted "can't write to C:\Program Files" hack is gone.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests
        run: dotnet test tests/Diariz.Api.Tests/Diariz.Api.Tests.csproj -c Release

  dotnet-integration:
    name: .NET integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Spins up real Postgres/pgvector, Redis, and MinIO via Testcontainers — Docker is
      # preinstalled on ubuntu-latest, so no Docker-host workaround is needed.
      - name: Integration tests
        run: dotnet test tests/Diariz.Api.IntegrationTests/Diariz.Api.IntegrationTests.csproj -c Release

  web:
    name: Web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      # `npm run build` is `tsc && vite build`, so this is the only gate covering two things
      # vitest never touches: the TypeScript typecheck (tests are excluded from the build's tsc via
      # tsconfig.json) and the production Vite/PostCSS/Tailwind pipeline. Runs before the tests so a
      # type error or a broken build dependency fails in seconds rather than after the full suite.
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Test
        working-directory: apps/web
        run: npm test

  desktop:
    name: Desktop (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      # A GATING run of the desktop unit tests. coverage.yml also runs them, but that job is
      # `continue-on-error: true` and ends in `|| true`, so it can never fail a PR - it exists to
      # report coverage, not to gate. That gap let a dependency bump to an ESM-only electron-store
      # reach a green PR while src/electronStore.test.js was failing inside the log, which is exactly
      # the breakage that test was written to catch. Tests that cannot fail a build are decoration.
      - name: Test
        working-directory: apps/desktop
        run: node --test "src/**/*.test.js"

  desktop-build:
    name: Desktop build (electron-builder)
    # NOT in the Main_Rules required set, so it reports without gating a merge. It is deliberately a
    # normal job rather than `continue-on-error: true`: a job that always reports success cannot tell
    # you anything, and this repo has already paid for that once - see the note on the `desktop` job
    # above, where a coverage run that could not fail let an ESM-only electron-store bump reach a green
    # PR with its tests failing inside the log.
    #
    # What this covers and what it does not. `apps/desktop` is tested but was never BUILT anywhere
    # except a `v*` release tag, so the first thing to discover that an Electron major broke packaging
    # was whoever cut the installer. This packages the app for real - electron download, the config,
    # asar, and the Outlook reader landing in extraResources - and stops there. It is a packaging
    # check: it says nothing about whether the tray, the loopback audio capture or the updater still
    # work at runtime, which still needs a human with an installer.
    #
    # windows-latest rather than ubuntu, because that is what actually ships: the win block is the one
    # with extraResources, and the Outlook reader is a win-x64 exe. `--dir` stops at the unpacked
    # directory, so there is no NSIS step and nothing to sign.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # The Outlook reader is a self-contained .NET exe that electron-builder copies in via
      # extraResources, so packaging fails without it having been published first.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      - name: Package (unpacked - no installer, no signing)
        working-directory: apps/desktop
        run: npm run dist:dir
      # electron-builder exiting 0 is not proof it produced anything. Assert the app exists, so a
      # config change that quietly stops emitting one fails here rather than at the next release.
      - name: Verify an app was actually produced
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $exe = "release/win-unpacked/Diariz.exe"
          if (-not (Test-Path $exe)) { throw "electron-builder reported success but produced no app at $exe" }
          "Packaged app: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

  locale-gate:
    name: Locale single-language gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history to diff the branch against its base
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # A translation-only PR may touch at most one non-English locale folder (core PRs are exempt).
      # Runs from the repo root so `git diff` finds the working tree.
      - name: Check one non-en locale per translation PR
        run: node apps/web/scripts/check-single-locale.mjs ${{ github.event.pull_request.base.sha }}

  n8n-node:
    name: n8n community node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/n8n-nodes-diariz/package-lock.json
      # The node's long tail of operations is generated from the published OpenAPI document. This test
      # rewrites the committed snapshot and fails when the API's public surface has moved, so an endpoint
      # cannot change under the node unnoticed. It needs no database or containers.
      - name: OpenAPI snapshot is current
        run: dotnet test tests/Diariz.Api.Tests/Diariz.Api.Tests.csproj -c Release --filter "FullyQualifiedName~OpenApiSnapshotTests"
      - name: Install
        working-directory: integrations/n8n-nodes-diariz
        run: npm ci
      - name: Regenerate operations
        working-directory: integrations/n8n-nodes-diariz
        run: npm run generate
      - name: Test
        working-directory: integrations/n8n-nodes-diariz
        run: npm test
      - name: Lint
        working-directory: integrations/n8n-nodes-diariz
        run: npm run lint
      - name: Build
        working-directory: integrations/n8n-nodes-diariz
        run: npm run build
      # Catches the case where the snapshot was current but the generated module was never regenerated
      # from it, which would leave the node advertising operations the API no longer has.
      - name: Generated output is committed
        run: git diff --exit-code -- integrations/n8n-nodes-diariz

  worker:
    name: Worker (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # whisperx/torch are stubbed in the tests, so only the lightweight deps are installed
      # (no GPU needed).
      - name: Install test deps
        working-directory: src/Diariz.Worker
        run: python -m pip install -r requirements-test.txt
      - name: Test
        working-directory: src/Diariz.Worker
        run: python -m pytest
