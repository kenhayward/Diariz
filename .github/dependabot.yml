# Dependabot version-update configuration.
#
# Monthly cadence + one grouped PR per ecosystem, to keep the update volume low (a weekly, un-grouped
# config produced ~17 individual PRs at once). Dependabot *alerts* and *security updates* (which react to
# the GitHub Advisory Database) are enabled separately under Settings -> Code security, not here, and are
# unaffected by this cadence.
version: 2
updates:
  # Web SPA (React/Vite/Tailwind).
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    groups:
      web-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the Node runtime, which CI pins (node-version '22' in ci.yml). A major bump
      # (e.g. 26) types APIs that runtime does not have, so it only moves alongside the CI Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # jsdom 30.1 renamed its Blob internals (`_buffer` -> `_bytes`), and vitest 4's createObjectURL
      # shim still reads `_buffer`, so every test making an object URL from a Blob throws. Vitest 5
      # reads both. Held at 30.0.x until the vitest 5 upgrade - issue #791 - then drop this.
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]

  # Electron desktop shell.
  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    schedule:
      interval: "monthly"
    groups:
      desktop-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ESM-only from v9; apps/desktop/src/main.js is CommonJS and does `require("electron-store")`,
      # which then yields a module namespace rather than the constructor. src/electronStore.test.js
      # asserts both halves of this. Unpin only alongside converting the main process to ESM.
      - dependency-name: "electron-store"

  # .NET API + Domain. Grouped so a framework bump (e.g. the ASP.NET/EF 9 -> 10 alignment) arrives as one
  # coordinated PR instead of individual bumps that can't build on their own.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      nuget-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python transcription worker. The GPU/compat stack is deliberately pinned (see CLAUDE.md) — let
  # Dependabot watch for security advisories but do NOT open version-bump PRs for those packages.
  - package-ecosystem: "pip"
    directory: "/src/Diariz.Worker"
    schedule:
      interval: "monthly"
    groups:
      worker-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "whisperx"
      - dependency-name: "transformers"
      - dependency-name: "huggingface_hub"
      - dependency-name: "ctranslate2"
      # 3.11+ requires Python >= 3.11, and the worker base image (nvidia/cuda ...-ubuntu22.04) ships
      # 3.10, so there is no installable wheel - the GPU image simply stops building. requirements.txt
      # predicted this exact Dependabot PR; the prediction was right and the ignore list was missing.
      - dependency-name: "matplotlib"

  # The GitHub Actions used by the CI/desktop-release/CodeQL workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
