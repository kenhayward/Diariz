#
# SD Card Support (all devices required)
#

CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Never auto-format the card. The mount also sets FS_MOUNT_FLAG_NO_FORMAT (sdcard.c),
# which already blocks it; disabling mkfs here drops the dead code and makes the intent
# a build-level guarantee. The PC owns formatting and deleting - see
# omi/firmware/docs/08-build-and-flash-runbook.md.
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_EXFAT=y
#nessessary?
# The main loop now performs fs_mount/fs_unmount and usb_enable when entering or
# leaving transfer mode, so it needs more than the 2048 it had for boot alone.
CONFIG_MAIN_STACK_SIZE=4096
# CONFIG_DISK_DRIVER_SDMMC=y
# CONFIG_SPI=y
CONFIG_HEAP_MEM_POOL_SIZE=512

#
# Disable unused peripherals
#
CONFIG_I2C=n
# CONFIG_NRFX_TWIM0=n
# CONFIG_NRFX_TWIM1=n

#
# LSM6DSL sensor (accelerometer and gyroscope)
#
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ENABLE_TEMP=n
# CONFIG_LSM6DSL_TRIGGER_GLOBAL_THREAD=y
CONFIG_SENSOR=y

#
# Speaker
#
CONFIG_I2S=y
CONFIG_I2S_NRFX=y
CONFIG_SPI_NRFX=y

#
