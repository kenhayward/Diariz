CONFIG_RING_BUFFER=y

CONFIG_PM_DEVICE=y
# CONFIG_NRFX_USBD=y

# CONFIG_FLASH=y

#
# Omi features configuration
#

CONFIG_OMI_CODEC_OPUS=y
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=y
CONFIG_OMI_ENABLE_ACCELEROMETER=n
CONFIG_OMI_ENABLE_BUTTON=y
CONFIG_OMI_ENABLE_SPEAKER=y
CONFIG_OMI_ENABLE_BATTERY=y
CONFIG_OMI_ENABLE_USB=y

# USB transfer mode: expose the SD card as a drive, plus a serial channel.
# The disk name must match the one sdcard.c passes to disk_access_init().
# USB_MASS_STORAGE selects DISK_ACCESS, which is already enabled above.
#
# The console is deliberately NOT enabled here. Runbook section 8.8 records that
# logging contends with SD writes and needs the log thread's priority dropped;
# transfer mode should be trustworthy before logging is layered on top of it.
# CDC is present as a transport for the clock sub-project, not as a console.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_MASS_STORAGE=y
CONFIG_MASS_STORAGE_DISK_NAME="SD"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_COMPOSITE_DEVICE=y

# CRITICAL: USB_DEVICE_INITIALIZE_AT_BOOT depends on USB_CDC_ACM and defaults on,
# so enabling CDC silently makes Zephyr call usb_enable() during system init
# (usb_device.c). That bypasses init_usb() entirely and re-exposes the SD card on
# every plug-in - the bug this whole design exists to prevent. Observed on
# hardware 2026-08-26, AFTER removing the explicit usb_enable() call, which was
# necessary but not sufficient. Enumeration must be ours to control.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# The build warns that USB_DEVICE_VID/PID are left at Zephyr's test values
# (0x2FE3 / 0x100) and "MUST be configured for USB products". That is left
# deliberately as-is: this is not a product, we do not own a USB vendor ID, and
# inventing one risks colliding with a real vendor's. Zephyr's test VID exists
# for exactly this case. Both mass storage and CDC bind by class on Windows,
# macOS and Linux, so no custom driver or matching VID is needed.
CONFIG_OMI_ENABLE_HAPTIC=y
