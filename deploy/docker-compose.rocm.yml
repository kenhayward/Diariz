# Diariz — full stack, AMD ROCm variant of the transcription worker.
# Run from this directory:  docker compose -f docker-compose.rocm.yml up --build
# Secrets/config come from ./.env (copy from .env.example).
#
# Identical to docker-compose.yml except the `worker` service: it builds Dockerfile.rocm and is given
# AMD GPU access (/dev/kfd + /dev/dri) instead of the NVIDIA Container Toolkit reservation. The ASR step
# runs on openai-whisper (PyTorch) because faster-whisper/CTranslate2 has no AMD GPU support; everything
# else (API, web, infra, the worker's align/diarize/voiceprints) is unchanged. Pick this OR the NVIDIA
# compose file — both use the `diariz` project name, so only one runs at a time.
#
# REQUIRES NATIVE LINUX — NOT WSL2 / Docker Desktop on Windows. WSL2 has no /dev/kfd (it bridges GPU compute
# via /dev/dxg + a WSL-specific ROCm this image doesn't use), so it fails at startup with: error gathering
# device information while adding custom device "/dev/kfd": no such file or directory. That error comes from
# the Docker DAEMON, before the container is created — no env var here can affect it. Confirmed on a Strix
# Halo box, 2026-08-12. On Windows/WSL2, run the standard worker CPU-only instead (docker-compose.yml +
# WORKER_DEVICE=cpu WORKER_COMPUTE_TYPE=int8). See src/Diariz.Worker/README.md -> AMD ROCm.
#
# For Strix Halo (gfx1151) prefer a RECENT kernel (6.15+; 6.8 may not bring the GPU up at all) and ROCm 7.x.
# ROCm 6.4.1 gives only basic rocBLAS on gfx1151 and no hipBLASLt, so treat it as a floor for "boots", not
# for "works well". If /dev/kfd is missing on native Linux, the usual cause is the amdgpu module being
# blacklisted — and removing the blacklist file is not enough, because it stays cached in the initramfs:
#   grep -rn "blacklist.*amdgpu" /etc/modprobe.d/ ; sudo update-initramfs -u ; sudo modprobe amdgpu

name: diariz

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Memory dials only - see docker-compose.yml for why each one is set and why the defaults are modest.
    # (This file does not load pg_stat_statements or the logging dials that the main compose file does;
    # that divergence predates this and is not addressed here.)
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      -c work_mem=${PG_WORK_MEM:-16MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      -c autovacuum_work_mem=${PG_AUTOVACUUM_WORK_MEM:-64MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
    # Parallel query shared memory lives in /dev/shm, which Docker caps at 64 MB - see docker-compose.yml.
    shm_size: 1gb
    environment:
      POSTGRES_DB: diariz
      POSTGRES_USER: diariz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required - set POSTGRES_PASSWORD in deploy/.env}
    # Published for external tooling on a NON-default host port - see docker-compose.yml for the full note.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diariz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persisted for the same reason as the CUDA stack: these streams are the job queues, and losing them
    # strands recordings mid-pipeline with no error. See the note in docker-compose.yml.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required - set REDIS_PASSWORD (hex/alphanumeric only) in deploy/.env}"]
    # Password-protected: every client on the compose network - including the observability overlay's GlitchTip,
    # which shares this instance - must authenticate. Without it anything on the network could read queued job
    # payloads or inject jobs. Use a hex/alphanumeric value: it is embedded in a redis:// URL and a StackExchange
    # connection string, where ':', '@', '/' and ',' would need escaping.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required - set REDIS_PASSWORD (hex/alphanumeric only) in deploy/.env}
    volumes:
      - redisdata:/data
    healthcheck:
      # redis-cli reads the password from REDISCLI_AUTH (below), so it never appears in the command line.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # SeaweedFS S3 gateway (issue #769). Replaced MinIO, whose community edition is archived and whose images
    # can no longer be pulled. Pinned: bump deliberately, after the integration suite passes on the new tag
    # (tests/Diariz.Api.IntegrationTests/Infrastructure/ContainersFixture.cs pins the same tag).
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # One process runs master + volume + filer + S3. -volume.max=0 sizes volumes from free disk (the default
    # cap of 8 runs out: each bucket is its own collection). Only the S3 port is used by the app; the API and
    # worker reach it in-network at s3:8333.
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -volume.max=0 -master.volumeSizeLimitMB=1024
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    environment:
      # Compose does NOT recreate this container when only the s3_identities content changes, so SeaweedFS
      # would keep serving the old identities. Naming the identity set here makes adding or dropping the
      # observability overlay (which adds `glitchtip`) a config change that recreates it. A key ROTATION is
      # not visible here: after changing any S3_* / GLITCHTIP_S3_* key, run
      #   docker compose up -d --force-recreate s3
      S3_IDENTITY_SET: "root,diariz"
    ports:
      # Host-only by default (a published port bypasses the host firewall); set S3_BIND=0.0.0.0 to reach it
      # from another machine. Host 9002 is kept from the MinIO days so existing tooling still works.
      - "${S3_BIND:-${MINIO_BIND:-127.0.0.1}}:9002:8333"   # S3 API (host 9002 -> container 8333)
    volumes:
      # A new volume name, not miniodata: a server switched to this file can never touch MinIO's data.
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: src/Diariz.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      # GET /health (reports version + DB/Redis readiness). start_period covers first-run EF migrations + seeding.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=diariz;Username=diariz;Password=${POSTGRES_PASSWORD:?required - set POSTGRES_PASSWORD in deploy/.env}"
      Jwt__Key: ${JWT_KEY:?required - set JWT_KEY in deploy/.env (random, at least 32 bytes)}
      Storage__Endpoint: "http://s3:8333"
      Storage__AccessKey: ${S3_APP_ACCESS_KEY:-${MINIO_APP_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_ACCESS_KEY in deploy/.env}}
      Storage__SecretKey: ${S3_APP_SECRET_KEY:-${MINIO_APP_SECRET_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_SECRET_KEY in deploy/.env}}
      JobQueue__RedisConnection: "redis:6379,password=${REDIS_PASSWORD:?required - set REDIS_PASSWORD (hex/alphanumeric only) in deploy/.env}"
      Worker__CallbackSecret: ${CALLBACK_SECRET:?required - set CALLBACK_SECRET in deploy/.env (shared with the worker)}
      Summarization__ApiBase: ${SUMMARY_API_BASE:-}
      Summarization__ApiKey: ${SUMMARY_API_KEY:-}
      Summarization__Model: ${SUMMARY_MODEL:-gpt-4o-mini}
      Identification__Enabled: ${IDENTIFICATION_ENABLED:-true}
      Identification__Threshold: ${IDENTIFICATION_THRESHOLD:-0.4}
      Chat__ContextLength: ${CHAT_CONTEXT_LENGTH:-131072}
      Chat__ToolsEnabled: ${CHAT_TOOLS_ENABLED:-false}
      Chat__DisabledTools: ${CHAT_DISABLED_TOOLS:-}
      Uploads__MaxBytes: ${UPLOAD_MAX_BYTES:-524288000}
      Uploads__AllowAac: ${UPLOAD_ALLOW_AAC:-true}
      DataProtection__KeysPath: /keys
      Seed__Email: ${SEED_EMAIL}
      Seed__Password: ${SEED_PASSWORD}
      Seed__FullName: ${SEED_FULL_NAME:-Platform Administrator}
      App__PublicUrl: ${APP_PUBLIC_URL:?required - set APP_PUBLIC_URL to the public origin, e.g. https://diariz.example.com}
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__User: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__From: ${SMTP_FROM:-}
      Email__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Cors__Origins__0: "http://localhost:5173"
      Cors__Origins__1: "http://localhost:8081"
    volumes:
      - apikeys:/keys
    ports:
      # Host-only by default. Browsers, the desktop app and any outer reverse proxy reach the API through the web
      # container on 8081; publishing 8080 more widely would also expose the internal worker-callback routes,
      # which nginx never forwards. Set API_BIND=0.0.0.0 only if something off-host genuinely needs it.
      - "${API_BIND:-127.0.0.1}:8080:8080"

  web:
    build:
      context: ../apps/web
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx serves the SPA index (busybox wget ships in nginx:alpine). This checks web liveness only,
      # independent of the API - the static index is returned even when /api is down. Use 127.0.0.1 (not
      # localhost): the SPA server block only `listen 80;` (IPv4), so an IPv6 `localhost` (::1) is refused.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "${WEB_BIND:-0.0.0.0}:8081:80"   # open the app at http://localhost:8081

  worker:
    build:
      context: ../src/Diariz.Worker
      dockerfile: Dockerfile.rocm
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      # The worker has no HTTP server - healthcheck.py checks the liveness heartbeat file (touched by a
      # daemon thread), so a worker busy on a long transcription still reports healthy. start_period covers
      # the torch/model import on first boot.
      test: ["CMD", "python3", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:?required - set REDIS_PASSWORD (hex/alphanumeric only) in deploy/.env}@redis:6379/0"
      S3_ENDPOINT: "http://s3:8333"
      S3_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-${MINIO_APP_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_ACCESS_KEY in deploy/.env}}
      S3_SECRET_KEY: ${S3_APP_SECRET_KEY:-${MINIO_APP_SECRET_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_SECRET_KEY in deploy/.env}}
      S3_BUCKET: "recordings"
      API_BASE_URL: "http://api:8080"
      CALLBACK_SECRET: ${CALLBACK_SECRET:?required - set CALLBACK_SECRET in deploy/.env (shared with the worker)}
      HF_TOKEN: ${HF_TOKEN}
      # PyTorch-ROCm exposes the AMD GPU as device "cuda". ASR is hardcoded to openai-whisper here — it's
      # intrinsic to this image, not a user choice (CTranslate2 has no AMD GPU support), so it must NOT be
      # env-overridable: a shared .env carried over from the NVIDIA stack would otherwise force "whisperx"
      # and break the AMD worker. COMPUTE_TYPE is unused by this backend but kept for parity.
      DEVICE: ${WORKER_DEVICE:-cuda}
      ASR_BACKEND: whisper
      COMPUTE_TYPE: ${WORKER_COMPUTE_TYPE:-float16}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-14400}
      ENABLE_SPEAKER_EMBEDDINGS: ${ENABLE_SPEAKER_EMBEDDINGS:-1}
      SPLIT_SEGMENTS_BY_WORD_SPEAKER: ${SPLIT_SEGMENTS_BY_WORD_SPEAKER:-1}
      SPLIT_LIVE_SEGMENTS_BY_WORD_SPEAKER: ${SPLIT_LIVE_SEGMENTS_BY_WORD_SPEAKER:-0}
      # Borrow a nearby arch's kernels (e.g. 11.0.0 = gfx1100), for correctness: the build has no kernels
      # for your GPU ("invalid device function" / no kernel image). It is often also described as a 2-6x
      # SPEED win on gfx1151 - that did not reproduce on ROCm 7.2.4 / torch 2.8.0 here (within noise warm,
      # 2.3x slower cold), so measure before setting it. Numbers in src/Diariz.Worker/README.md -> AMD ROCm.
      # NOTE: this interpolation hands the container the variable SET BUT EMPTY when it is blank in .env,
      # and to the ROCm runtime that is NOT the same as unset - it stops finding the GPU entirely and the
      # worker silently drops to CPU. worker.py strips the empty value before importing torch
      # (rocm_env.clean_gfx_override), which is what makes a blank default safe here.
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}
    volumes:
      - workercache:/root/.cache
    # AMD ROCm GPU access (replaces the NVIDIA Container Toolkit reservation). The host must have ROCm
    # installed and the invoking user in the `video`/`render` groups.
    devices:
      - /dev/kfd
      - /dev/dri
    # The container runs as root (the rocm/pytorch base sets no USER), so it opens /dev/kfd via
    # CAP_DAC_OVERRIDE no matter what groups it holds - verified on a Ryzen AI Max+ 395 by running the
    # worker image with NO group_add at all and getting a clean GPU matmul. So this list is belt-and-braces
    # for anyone who adds a non-root USER, not something the GPU currently depends on.
    #
    # It must be NUMERIC. `group_add` resolves names inside the CONTAINER, and the rocm/pytorch images
    # ship `video` but no `render` group at all - so `- render` does not merely fail to help, it aborts
    # container creation with "unable to find group render: no matching entries in group file". Even on an
    # image that does define it the name is the wrong lever, because access is decided by the HOST's
    # numeric GID: /dev/kfd here is root:render(990) while the ROCm 7.0.2 image calls `render` 991.
    #
    # 44 is `video` on Debian/Ubuntu hosts. If you add a non-root USER to the worker image, ALSO add your
    # host's render GID here as a quoted number - find it with:  getent group render | cut -d: -f3
    # (it is 990 on this Ubuntu box, but it is not stable across distros, which is exactly why the name
    # cannot be used). Do not add it twice: compose rejects duplicate group_add entries.
    group_add:
      - "44"
    security_opt:
      - seccomp:unconfined
    ipc: host

volumes:
  pgdata:
  s3data:
  workercache:
  apikeys:
  redisdata:

configs:
  # SeaweedFS identities. Inline so Compose interpolates the keys from deploy/.env; the file exists only
  # inside the s3 container (needs Compose v2.23.1+). Root administers the store; the app identity is
  # confined to `recordings` (Admin:recordings is what lets the API create its own bucket on first boot).
  # The old MINIO_* names still resolve as fallbacks, so an existing .env keeps working.
  # The observability overlay REPLACES this whole config to add a GlitchTip identity - keep the two in step.
  s3_identities:
    content: |
      {"identities":[
        {"name":"root","credentials":[{"accessKey":"${S3_ROOT_ACCESS_KEY:-${MINIO_ROOT_USER:?required - run deploy/NewS3Keys.cmd root and set S3_ROOT_ACCESS_KEY in deploy/.env}}","secretKey":"${S3_ROOT_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?required - run deploy/NewS3Keys.cmd root and set S3_ROOT_SECRET_KEY in deploy/.env}}"}],
         "actions":["Admin","Read","Write","List","Tagging"]},
        {"name":"diariz","credentials":[{"accessKey":"${S3_APP_ACCESS_KEY:-${MINIO_APP_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd and set S3_APP_ACCESS_KEY in deploy/.env}}","secretKey":"${S3_APP_SECRET_KEY:-${MINIO_APP_SECRET_KEY:?required - run deploy/NewS3Keys.cmd and set S3_APP_SECRET_KEY in deploy/.env}}"}],
         "actions":["Admin:recordings","Read:recordings","Write:recordings","List:recordings","Tagging:recordings"]}
      ]}
