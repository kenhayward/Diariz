# Optional observability overlay: self-hosted GlitchTip (error tracking + transaction timings).
#
# Opt-in, and deliberately a separate file so the core stack is unchanged for anyone who does not
# want it. Turn it on with COMPOSE_FILE in deploy/.env (see .env.example), not with -f flags: this overlay
# also changes the `s3` service (GlitchTip's storage identity), so every compose command has to see it.
#
# GlitchTip gets its OWN Postgres (not a second database inside the app's pgvector container):
#   - the platform backup/restore operates on the app database; co-locating an observability tool's
#     tables entangles two things with different retention and recovery semantics,
#   - the postgres image only auto-creates POSTGRES_DB, and a second-database init script only runs
#     on a FRESH volume - on the existing dev/prod boxes it would silently not run,
#   - GlitchTip needs pg14+ while the app is pinned to 16 for pgvector; decoupling stops GlitchTip's
#     upgrade cycle blocking the app's.
#
# It DOES share the app's Redis, on DB index 1. VALKEY_URL is optional for GlitchTip and only affects
# caching and task-queue speed, and it saves a container. That Redis is password-protected (REDIS_PASSWORD),
# so GlitchTip authenticates like every other client.
name: diariz

services:
  glitchtip-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD:-glitchtip}
    volumes:
      - glitchtipdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    environment:
      # See docker-compose.yml: changing this recreates the s3 container so it loads the identities below.
      S3_IDENTITY_SET: "root,diariz,glitchtip"

  s3-buckets:
    # One-shot: create GlitchTip's bucket in the SeaweedFS store (issue #769). django-storages no longer
    # creates buckets, and the MinIO provision script that used to is gone. `weed shell` talks to SeaweedFS's
    # master/filer in-network, so this needs no credentials and no extra image. Safe to re-run: an existing
    # bucket counts as success. GlitchTip waits for this to finish before it starts.
    image: chrislusf/seaweedfs:4.48
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: ["sh", "-c"]
    command:
      - >
        out=$$(echo "s3.bucket.create -name $${BUCKET}" | weed shell -master=s3:9333 -filer=s3:8888 2>&1);
        echo "$$out";
        echo "$$out" | grep -qE "created bucket|already exists"
    environment:
      BUCKET: ${GLITCHTIP_COLD_STORAGE_BUCKET:-glitchtip}
    restart: "no"

  glitchtip:
    # NO `v` PREFIX. GlitchTip dropped it partway through the 6.0 line: `v6`, `v6.0` and `v6.0.3`
    # exist, `6.0.3` exists as both, and from 6.0.4 onwards only the bare form is published. So
    # `v6.2` looks plausible, is what the release announcement reads like, and does not exist -
    # the pull fails with "manifest unknown" long after you have set everything else up.
    #
    # Pinned to the minor line rather than a patch, matching postgres:16-alpine and redis:8-alpine
    # above: `docker compose pull` then picks up 6.2.x security fixes without pulling in new
    # features unannounced.
    image: glitchtip/glitchtip:6.2
    restart: unless-stopped
    depends_on:
      glitchtip-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-buckets: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: "postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD:-glitchtip}@glitchtip-postgres:5432/glitchtip"
      # DB index 1 - the app's queues live on index 0 and must not be disturbed.
      VALKEY_URL: "redis://:${REDIS_PASSWORD:?required - set REDIS_PASSWORD in deploy/.env}@redis:6379/1"
      # The `:?` values below are REQUIRED and fail the compose command with the message shown if
      # they are unset or blank. That is deliberate: with a plain ${VAR} an empty value substitutes
      # silently, the container starts, and the failure surfaces much later as something unrelated -
      # an empty SECRET_KEY gets you a Django ImproperlyConfigured traceback on the first request,
      # which reads like a bug rather than a missing paste. Fail at `up`, naming the variable.
      #
      # Cost of this: `docker compose down` also parses the file, so it too needs the values present.
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?required - run deploy/NewGlitchTipSecrets.cmd and paste into deploy/.env}
      # MUST include the scheme. Django derives its trusted CSRF origins from this, and a mismatch
      # presents as "wrong password" on every login attempt rather than anything mentioning CSRF.
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:?required - the full external URL including https://}
      # Required. A comma-separated list that MUST include the internal service name as well as the
      # public hostname, e.g. `glitchtip.example.com,glitchtip`: the API and worker post to
      # `http://glitchtip:8000`, so their requests carry `Host: glitchtip`, and Django rejects any host
      # not listed. Setting this to the public hostname alone silently kills all server-side reporting
      # while the browser keeps working.
      ALLOWED_HOSTS: ${GLITCHTIP_ALLOWED_HOSTS:?required - public hostname AND the internal name, e.g. glitchtip.example.com,glitchtip}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:?required - run deploy/NewGlitchTipSecrets.cmd}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:?required - run deploy/NewGlitchTipSecrets.cmd}
      # Internal tool on a public subdomain: no open registration, no new orgs.
      #
      # Both are safe to leave off from the very first boot - neither locks you out of your own
      # empty instance. Each gate has a first-run escape hatch, in the backend AND mirrored in the
      # frontend, so the bootstrap works with both set to false:
      #   registration: `ENABLE_USER_REGISTRATION or not User.objects.exists()`
      #   organization: `ENABLE_ORGANIZATION_CREATION or not Organization.objects.aexists()`
      #                 (and superusers are exempt from the org gate regardless)
      # So the first account signs up and creates the first org through the normal UI, and both
      # doors shut behind it; everyone after that arrives by invitation. If the register link is
      # missing on a fresh instance, the cause is NOT this flag - see GLITCHTIP_EMBED_WORKER below.
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      # REQUIRED, and not the optional-looking flag it reads as. The image entrypoint (`bin/start.sh`)
      # only runs `./manage.py migrate` when the Heroku `DYNO` env var is set; under Compose it is
      # not, so the plain `web` role starts against an UNMIGRATED database. Every table is missing,
      # and the symptom is not "migrations did not run" - it is a login page that renders fine (the
      # SPA is static) with no register link, because the settings API 500s on
      # `relation "socialaccount_socialapp" does not exist`. Upstream's own compose papers over this
      # with a separate one-shot migrate service.
      #
      # Setting this flips SERVER_ROLE to `all_in_one`, which runs `bin/run-all-in-one.sh`:
      # `migrate` + `maintain_partitions` (issue events live in PARTITIONED tables - without this
      # ingest fails later, separately) + `createcachetable`, and then embeds the task worker in the
      # web process. That last part is also required, not a bonus: the `web` role runs no worker at
      # all, so alert emails, uptime checks and cleanup would silently never fire.
      GLITCHTIP_EMBED_WORKER: "true"
      # Spans (as opposed to bare transactions) require DuckDB. It runs inside the existing Python
      # process writing Parquet, so this costs ~128 MB of RAM and no extra container.
      GLITCHTIP_ENABLE_DUCKDB: "true"
      GLITCHTIP_COLD_STORAGE_BUCKET: ${GLITCHTIP_COLD_STORAGE_BUCKET:-glitchtip}
      AWS_S3_ENDPOINT_URL: "http://s3:8333"
      # REQUIRED once AWS_S3_ENDPOINT_URL is set, and easy to miss because nothing complains at boot.
      # Setting the endpoint switches Django's default file storage to S3Boto3Storage, but the bucket
      # is a SEPARATE setting - leave it unset and `diffsettings` shows
      # `AWS_STORAGE_BUCKET_NAME = None` beside an active S3 backend. Every file write then has
      # nowhere to go, and the symptom is a source map upload dying on
      # `chunk-upload returned 500 Internal Server Error` with a bare Django error page.
      #
      # NOTE this is a different mechanism from GLITCHTIP_COLD_STORAGE_BUCKET above: that one is
      # DuckDB's Parquet archive, this one is django-storages for uploaded files (source maps, debug
      # symbols). Same bucket by design - both are GlitchTip's own data, the scoped GlitchTip identity already
      # has every action on it, and sharing the variable stops the two drifting apart.
      AWS_STORAGE_BUCKET_NAME: ${GLITCHTIP_COLD_STORAGE_BUCKET:-glitchtip}
      # Namespace uploaded files under a prefix so they are visibly distinct from the Parquet archive
      # sharing the bucket. Cold-storage cleanup is enabled by default; whether it is prefix-scoped
      # has NOT been verified, so keeping the two apart is cheap insurance. If artifacts ever vanish
      # after a cleanup run, that is the cause, and the fix is a bucket of their own.
      AWS_LOCATION: "uploads"
      AWS_ACCESS_KEY_ID: ${GLITCHTIP_S3_ACCESS_KEY:-${GLITCHTIP_MINIO_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd glitchtip and set GLITCHTIP_S3_ACCESS_KEY in deploy/.env}}
      AWS_SECRET_ACCESS_KEY: ${GLITCHTIP_S3_SECRET_KEY:-${GLITCHTIP_MINIO_SECRET_KEY:?required - run deploy/NewS3Keys.cmd glitchtip and set GLITCHTIP_S3_SECRET_KEY in deploy/.env}}
    ports:
      # Published for the OUTER reverse proxy only. Bind to localhost so it is not LAN-reachable:
      # Docker publishes to 0.0.0.0 by default AND writes its own DNAT rules, bypassing the host
      # firewall (same trap documented on the postgres service in docker-compose.yml).
      - "${GLITCHTIP_BIND:-127.0.0.1}:${GLITCHTIP_PORT:-8000}:8000"

volumes:
  glitchtipdata:

configs:
  # SeaweedFS identities. Inline so Compose interpolates the keys from deploy/.env; the file exists only
  # inside the s3 container (needs Compose v2.23.1+). Root administers the store; the app identity is
  # confined to `recordings` (Admin:recordings is what lets the API create its own bucket on first boot).
  # The old MINIO_* names still resolve as fallbacks, so an existing .env keeps working.
  # REPLACES docker-compose.yml's s3_identities (Compose merges top-level configs by name) to add the
  # GlitchTip identity, confined to its own bucket. Keep the root and diariz entries in step with that file.
  s3_identities:
    content: |
      {"identities":[
        {"name":"root","credentials":[{"accessKey":"${S3_ROOT_ACCESS_KEY:-${MINIO_ROOT_USER:?required - run deploy/NewS3Keys.cmd root and set S3_ROOT_ACCESS_KEY in deploy/.env}}","secretKey":"${S3_ROOT_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?required - run deploy/NewS3Keys.cmd root and set S3_ROOT_SECRET_KEY in deploy/.env}}"}],
         "actions":["Admin","Read","Write","List","Tagging"]},
        {"name":"diariz","credentials":[{"accessKey":"${S3_APP_ACCESS_KEY:-${MINIO_APP_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd and set S3_APP_ACCESS_KEY in deploy/.env}}","secretKey":"${S3_APP_SECRET_KEY:-${MINIO_APP_SECRET_KEY:?required - run deploy/NewS3Keys.cmd and set S3_APP_SECRET_KEY in deploy/.env}}"}],
         "actions":["Admin:recordings","Read:recordings","Write:recordings","List:recordings","Tagging:recordings"]},
        {"name":"glitchtip","credentials":[{"accessKey":"${GLITCHTIP_S3_ACCESS_KEY:-${GLITCHTIP_MINIO_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd glitchtip and set GLITCHTIP_S3_ACCESS_KEY in deploy/.env}}","secretKey":"${GLITCHTIP_S3_SECRET_KEY:-${GLITCHTIP_MINIO_SECRET_KEY:?required - run deploy/NewS3Keys.cmd glitchtip and set GLITCHTIP_S3_SECRET_KEY in deploy/.env}}"}],
         "actions":["Admin:${GLITCHTIP_COLD_STORAGE_BUCKET:-glitchtip}","Read:${GLITCHTIP_COLD_STORAGE_BUCKET:-glitchtip}","Write:${GLITCHTIP_COLD_STORAGE_BUCKET:-glitchtip}","List:${GLITCHTIP_COLD_STORAGE_BUCKET:-glitchtip}","Tagging:${GLITCHTIP_COLD_STORAGE_BUCKET:-glitchtip}"]}
      ]}
