# Diariz — full stack for Milestone 1 (web UI + API + worker + infra).
# Run from this directory:  docker compose up --build
# Secrets/config come from ./.env (copy from .env.example).

# Project/stack name (Docker requires lowercase, so this shows as "diariz"
# instead of defaulting to the "deploy" directory name).
name: diariz

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Server tuning + observability. shared_preload_libraries can ONLY be set at startup (ALTER SYSTEM
    # + reload will not do it), which is why it lives here rather than in postgresql.conf at runtime.
    #
    # pg_stat_statements is what makes a slow endpoint diagnosable from the database side instead of by
    # scraping API logs; it ships in this image but is not loaded by default. Install it once per database
    # after the first start with:  CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    #
    # The three logging dials exist because a cartesian-product query silently spilled 207 MB to disk on
    # every open of a large recording, and nothing in the default configuration said so (see 0.228.2).
    # log_temp_files=0 logs EVERY spill, which is the signal that was missing.
    #
    # The five memory dials are set because the image defaults assume nothing about the host and so assume
    # the worst: shared_buffers 128 MB, work_mem 4 MB, maintenance_work_mem 64 MB, effective_cache_size
    # 4 GB. A vector(768) is 3,076 bytes, so a sort or hash over TranscriptChunk passes 4 MB after about
    # 1,300 rows and spills - the dial above then dutifully logs a spill that is a tuning artefact rather
    # than the query-shape bug it was added to catch. maintenance_work_mem is what decides whether an HNSW
    # build keeps the graph in memory or falls back to the much slower on-disk path.
    #
    # The DEFAULTS here are deliberately modest, not tuned: this file is public and anyone can `up` it, and
    # a shared_buffers larger than the host can allocate stops Postgres from starting at all. Set the real
    # values per deployment in deploy/.env - .env.example carries a worked set for a 128 GB host.
    #
    # autovacuum_work_mem is pinned rather than left at -1 (meaning "use maintenance_work_mem"), because
    # otherwise raising maintenance_work_mem silently multiplies by autovacuum_max_workers: three workers
    # would each claim 2 GB on the host set sized in .env.example.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=5000
      -c pg_stat_statements.track=all
      -c track_io_timing=on
      -c log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-250}
      -c log_temp_files=${PG_LOG_TEMP_FILES_KB:-0}
      -c log_lock_waits=on
      -c shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      -c work_mem=${PG_WORK_MEM:-16MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      -c autovacuum_work_mem=${PG_AUTOVACUUM_WORK_MEM:-64MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
    environment:
      POSTGRES_DB: diariz
      POSTGRES_USER: diariz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required - set POSTGRES_PASSWORD in deploy/.env}
    # Published for external tooling (psql / pgAdmin / test harnesses) on a NON-default host port so it
    # doesn't clash with a Postgres already running on the host's 5432. The app never uses this - the API
    # and worker reach Postgres in-network at postgres:5432. Docker publishes to 0.0.0.0 by default AND
    # bypasses the host firewall (it writes its own DNAT rules), so it is bound to 127.0.0.1 by default: tunnel
    # over SSH, or set POSTGRES_BIND=0.0.0.0 (with a strong POSTGRES_PASSWORD) to reach it from the LAN.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    # Postgres puts the shared memory a parallel query needs (Parallel Hash, shared tuplestores) in
    # /dev/shm, which Docker caps at 64 MB regardless of host RAM. Raising work_mem raises what a parallel
    # worker will try to put there, and the failure is a mid-query "could not resize shared memory segment
    # ... No space left on device" rather than anything at startup. 1 GB is ample for this workload.
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on a FRESH data directory only, as the bootstrap superuser: creates
      # pg_stat_statements so a new deployment is not silently missing it. Deliberately not an EF
      # migration - the extension needs superuser, the API runs migrations at startup, and a managed
      # Postgres would then refuse to boot the API over an observability extension. See the file.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diariz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Redis holds the job queues (transcription, summarisation, minutes, actions, tags, formulas,
    # embeddings, audio merge) as streams, plus their consumer-group state. Without persistence a restart
    # silently discards every queued-but-unstarted job and every in-flight job's pending entry: recordings
    # are left in Transcribing/Summarizing with nothing to move them on, and no error anywhere.
    #
    # appendonly is on rather than relying on the default RDB snapshots, which only fsync on a schedule
    # (up to a minute of writes, or an hour on a quiet stack) - fine for a cache, not for a work queue
    # where each lost entry is a meeting that never finishes processing.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required - set REDIS_PASSWORD (hex/alphanumeric only) in deploy/.env}"]
    # Password-protected: every client on the compose network - including the observability overlay's GlitchTip,
    # which shares this instance - must authenticate. Without it anything on the network could read queued job
    # payloads or inject jobs. Use a hex/alphanumeric value: it is embedded in a redis:// URL and a StackExchange
    # connection string, where ':', '@', '/' and ',' would need escaping.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required - set REDIS_PASSWORD (hex/alphanumeric only) in deploy/.env}
    volumes:
      - redisdata:/data
    healthcheck:
      # redis-cli reads the password from REDISCLI_AUTH (below), so it never appears in the command line.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # SeaweedFS S3 gateway (issue #769). Replaced MinIO, whose community edition is archived and whose images
    # can no longer be pulled. Pinned: bump deliberately, after the integration suite passes on the new tag
    # (tests/Diariz.Api.IntegrationTests/Infrastructure/ContainersFixture.cs pins the same tag).
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # One process runs master + volume + filer + S3. -volume.max=0 sizes volumes from free disk (the default
    # cap of 8 runs out: each bucket is its own collection). Only the S3 port is used by the app; the API and
    # worker reach it in-network at s3:8333.
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -volume.max=0 -master.volumeSizeLimitMB=1024
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    environment:
      # Compose does NOT recreate this container when only the s3_identities content changes, so SeaweedFS
      # would keep serving the old identities. Naming the identity set here makes adding or dropping the
      # observability overlay (which adds `glitchtip`) a config change that recreates it. A key ROTATION is
      # not visible here: after changing any S3_* / GLITCHTIP_S3_* key, run
      #   docker compose up -d --force-recreate s3
      S3_IDENTITY_SET: "root,diariz"
    ports:
      # Host-only by default (a published port bypasses the host firewall); set S3_BIND=0.0.0.0 to reach it
      # from another machine. Host 9002 is kept from the MinIO days so existing tooling still works.
      - "${S3_BIND:-${MINIO_BIND:-127.0.0.1}}:9002:8333"   # S3 API (host 9002 -> container 8333)
    volumes:
      # A new volume name, not miniodata: a server switched to this file can never touch MinIO's data.
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: src/Diariz.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      # GET /health (reports version + DB/Redis readiness). start_period covers first-run EF migrations + seeding.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # EF Core logs EVERY executed statement, with its full SQL text, at Information - and the base
      # appsettings.json sets Default=Information, so production was writing a line per query (the webhook
      # poller alone fires every 2 s). src/Diariz.Api/appsettings.Production.json turns those two categories
      # down to Warning; these vars are the operator dial over that file, since environment variables win
      # over appsettings.{Environment}.json. Leave them unset in .env to take the file's value.
      #
      # Deliberately NOT lowering Default, and deliberately stopping at Infrastructure: that leaves
      # Microsoft.EntityFrameworkCore.Query at its default, which is the category that emits
      # MultipleCollectionIncludeWarning - the warning that correctly reported the 0.228.2 cartesian bug.
      # Set both to Information temporarily when you need to watch the SQL a request actually runs.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: ${EF_SQL_LOG_LEVEL:-Warning}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Infrastructure: ${EF_INFRA_LOG_LEVEL:-Warning}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=diariz;Username=diariz;Password=${POSTGRES_PASSWORD:?required - set POSTGRES_PASSWORD in deploy/.env}"
      Jwt__Key: ${JWT_KEY:?required - set JWT_KEY in deploy/.env (random, at least 32 bytes)}
      # The API streams audio to the browser itself (same-origin), so the S3 store never needs to be
      # browser-reachable - only the API reaches it at s3:8333.
      Storage__Endpoint: "http://s3:8333"
      Storage__AccessKey: ${S3_APP_ACCESS_KEY:-${MINIO_APP_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_ACCESS_KEY in deploy/.env}}
      Storage__SecretKey: ${S3_APP_SECRET_KEY:-${MINIO_APP_SECRET_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_SECRET_KEY in deploy/.env}}
      JobQueue__RedisConnection: "redis:6379,password=${REDIS_PASSWORD:?required - set REDIS_PASSWORD (hex/alphanumeric only) in deploy/.env}"
      Worker__CallbackSecret: ${CALLBACK_SECRET:?required - set CALLBACK_SECRET in deploy/.env (shared with the worker)}
      Summarization__ApiBase: ${SUMMARY_API_BASE:-}
      Summarization__ApiKey: ${SUMMARY_API_KEY:-}
      Summarization__Model: ${SUMMARY_MODEL:-gpt-4o-mini}
      # Reasoning models: send reasoning_effort on LLM requests. Off by default; per-user overridable in Settings.
      Summarization__ReasoningEnabled: ${SUMMARY_REASONING_ENABLED:-false}
      Summarization__ReasoningEffort: ${SUMMARY_REASONING_EFFORT:-medium}
      # App-wide LLM parameter defaults (bottom of the layer stack, below any configured model).
      LlmDefaults__Temperature: ${LLM_DEFAULT_TEMPERATURE:-0.3}
      LlmDefaults__Translation__Temperature: ${LLM_DEFAULT_TRANSLATION_TEMPERATURE:-0.1}
      LlmDefaults__TimeoutSeconds: ${LLM_DEFAULT_TIMEOUT_SECONDS:-120}
      # Chat voice dictation (server fallback for desktop/Safari/Firefox). Empty ApiBase disables it.
      Dictation__ApiBase: ${DICTATION_API_BASE:-}
      Dictation__ApiKey: ${DICTATION_API_KEY:-}
      Dictation__Model: ${DICTATION_MODEL:-whisper-1}
      Dictation__TimeoutSeconds: ${DICTATION_TIMEOUT_SECONDS:-30}
      # Semantic search (RAG) embeddings. Empty ApiBase reuses the owner's summarisation endpoint; empty
      # everywhere keeps search lexical. Model + dimension are server-pinned (must match the vector(768) column).
      Embedding__ApiBase: ${EMBED_API_BASE:-}
      Embedding__ApiKey: ${EMBED_API_KEY:-}
      Embedding__Model: ${EMBED_MODEL:-nomic-embed-text}
      Embedding__Dimension: ${EMBED_DIMENSION:-768}
      # nomic task prefixes (improve retrieval); set both empty for models that don't use them (e.g. OpenAI).
      # Quoted because the default contains a colon-space, which unquoted YAML reads as a nested mapping.
      Embedding__QueryPrefix: "${EMBED_QUERY_PREFIX:-search_query: }"
      Embedding__DocumentPrefix: "${EMBED_DOCUMENT_PREFIX:-search_document: }"
      # Speaker identification (voiceprints). Threshold is the max cosine distance for an
      # auto-match — conservative by default; tune per your audio (lower = stricter).
      Identification__Enabled: ${IDENTIFICATION_ENABLED:-true}
      Identification__Threshold: ${IDENTIFICATION_THRESHOLD:-0.4}
      # Platform-wide model context window (tokens): the chat dial AND the single context budget for
      # every LLM call (summaries, minutes, folder roll-ups, formulas, chat). See .env.example.
      Chat__ContextLength: ${CHAT_CONTEXT_LENGTH:-131072}
      Chat__ToolsEnabled: ${CHAT_TOOLS_ENABLED:-false}
      Chat__DisabledTools: ${CHAT_DISABLED_TOOLS:-}
      # Uploaded-audio limits (the "Upload" button). AllowAac=false drops M4A/AAC for commercial caution.
      Uploads__MaxBytes: ${UPLOAD_MAX_BYTES:-524288000}
      Uploads__AllowAac: ${UPLOAD_ALLOW_AAC:-true}
      # Persist the Data Protection keyring so encrypted per-user API keys survive container recreates.
      DataProtection__KeysPath: /keys
      Seed__Email: ${SEED_EMAIL}
      Seed__Password: ${SEED_PASSWORD}
      Seed__FullName: ${SEED_FULL_NAME:-Platform Administrator}
      App__PublicUrl: ${APP_PUBLIC_URL:?required - set APP_PUBLIC_URL to the public origin, e.g. https://diariz.example.com}
      # OAuth 2.1 sign-in for the claude.ai web MCP connector. On by default; the token issuer is App__PublicUrl
      # (must be the public HTTPS origin in production) and the signing/encryption keys persist to the /keys
      # volume above. A client may only register a redirect_uri on this host allowlist (defaults cover
      # claude.ai/claude.com + loopback). Set McpOAuth__Enabled=false to turn the OAuth server off entirely.
      McpOAuth__Enabled: ${MCP_OAUTH_ENABLED:-true}
      # Google sign-in (optional). Leave the client id/secret empty to disable it (the login page then hides
      # the Google button). RedirectUri is derived from App__PublicUrl when left blank.
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
      GoogleAuth__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      GoogleAuth__RedirectUri: ${GOOGLE_REDIRECT_URI:-}
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__User: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__From: ${SMTP_FROM:-}
      Email__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Cors__Origins__0: "http://localhost:5173"
      Cors__Origins__1: "http://localhost:8081"
      # Optional error + performance reporting. Empty DSN = completely inert.
      Sentry__Dsn: ${SENTRY_API_DSN:-}
      Sentry__Environment: ${SENTRY_ENVIRONMENT:-production}
      Sentry__TracesSampleRate: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      # Browser DSN, served to the SPA at runtime by GET /api/config. Public by design (it ships in
      # the JS bundle), and a SEPARATE GlitchTip project from Sentry__Dsn so browser noise does not
      # bury server errors. Empty = the SPA reports nothing.
      Sentry__BrowserDsn: ${SENTRY_BROWSER_DSN:-}
    volumes:
      - apikeys:/keys
    ports:
      # Host-only by default. Browsers, the desktop app and any outer reverse proxy reach the API through the web
      # container on 8081; publishing 8080 more widely would also expose the internal worker-callback routes,
      # which nginx never forwards. Set API_BIND=0.0.0.0 only if something off-host genuinely needs it.
      - "${API_BIND:-127.0.0.1}:8080:8080"

  # Static web UI served by nginx, proxying /api and /hubs to the API container.
  web:
    build:
      context: ../apps/web
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        # App version baked into __APP_VERSION__ and used to tag uploaded source maps (see
        # apps/web/vite.config.ts). Empty by default - the Dockerfile then falls back to
        # apps/web/package.json's version, the same value appVersion() falls back to at runtime.
        APP_VERSION: ${APP_VERSION:-}
        # Source map upload to GlitchTip (optional, see deploy/.env.example). Empty URL/org/project =
        # the build stage logs a line and skips it; the image still builds either way. But once all
        # four ARE set, a FAILED upload now fails the build rather than warning - see the reasoning in
        # apps/web/Dockerfile. GLITCHTIP_ORG is the lowercase SLUG from the URL, not the display name.
        GLITCHTIP_URL: ${GLITCHTIP_URL:-}
        GLITCHTIP_ORG: ${GLITCHTIP_ORG:-}
        GLITCHTIP_PROJECT: ${GLITCHTIP_PROJECT:-}
        # Escape hatch: set to any non-empty value to downgrade a failed upload back to a warning, for
        # when GlitchTip is down and the web app has to ship regardless.
        GLITCHTIP_SOURCEMAPS_OPTIONAL: ${GLITCHTIP_SOURCEMAPS_OPTIONAL:-}
      # BuildKit secret for the GlitchTip auth token - never a build arg (an arg is recorded in the
      # image history and readable by anyone who can pull the image). See the top-level `secrets:`
      # block below: it is sourced straight from GLITCHTIP_TOKEN in .env, not a file on disk.
      secrets:
        - glitchtip_token
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx serves the SPA index (busybox wget ships in nginx:alpine). This checks web liveness only,
      # independent of the API - the static index is returned even when /api is down. Use 127.0.0.1 (not
      # localhost): the SPA server block only `listen 80;` (IPv4), so an IPv6 `localhost` (::1) is refused.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "${WEB_BIND:-0.0.0.0}:8081:80"   # open the app at http://localhost:8081

  worker:
    build:
      context: ../src/Diariz.Worker
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      # The worker has no HTTP server - healthcheck.py checks the liveness heartbeat file (touched by a
      # daemon thread), so a worker busy on a long transcription still reports healthy. start_period covers
      # the torch/model import on first boot.
      test: ["CMD", "python3", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:?required - set REDIS_PASSWORD (hex/alphanumeric only) in deploy/.env}@redis:6379/0"
      S3_ENDPOINT: "http://s3:8333"
      S3_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-${MINIO_APP_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_ACCESS_KEY in deploy/.env}}
      S3_SECRET_KEY: ${S3_APP_SECRET_KEY:-${MINIO_APP_SECRET_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_SECRET_KEY in deploy/.env}}
      S3_BUCKET: "recordings"
      API_BASE_URL: "http://api:8080"
      CALLBACK_SECRET: ${CALLBACK_SECRET:?required - set CALLBACK_SECRET in deploy/.env (shared with the worker)}
      HF_TOKEN: ${HF_TOKEN}
      DEVICE: ${WORKER_DEVICE:-cuda}
      COMPUTE_TYPE: ${WORKER_COMPUTE_TYPE:-float16}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      # WhisperX transcription batch size. Lower it (8/4) to cut peak VRAM on smaller GPUs.
      BATCH_SIZE: ${BATCH_SIZE:-16}
      # Reject audio longer than this many seconds (0 = unlimited). 14400 = 4 h.
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-14400}
      # Per-speaker ECAPA voiceprint embeddings (for identification). Set to 0 to disable.
      ENABLE_SPEAKER_EMBEDDINGS: ${ENABLE_SPEAKER_EMBEDDINGS:-1}
      # Split a segment where the word-level speaker changes (issue #803): full files on, live off.
      SPLIT_SEGMENTS_BY_WORD_SPEAKER: ${SPLIT_SEGMENTS_BY_WORD_SPEAKER:-1}
      SPLIT_LIVE_SEGMENTS_BY_WORD_SPEAKER: ${SPLIT_LIVE_SEGMENTS_BY_WORD_SPEAKER:-0}
      # Optional error + performance reporting. Empty DSN = completely inert.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
    volumes:
      # Persist downloaded models (whisper large-v3, wav2vec2 align, pyannote) across
      # container recreates so a rebuild doesn't re-download ~4GB. Covers both the torch
      # hub cache (/root/.cache/torch) and the HF hub cache (/root/.cache/huggingface).
      - workercache:/root/.cache
    # GPU access — requires the NVIDIA Container Toolkit on the host.
    # For CPU-only, comment this out and set WORKER_DEVICE=cpu, WORKER_COMPUTE_TYPE=int8.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # A second worker that consumes ONLY live chunks (profile: live-worker).
  #
  # The general worker above already reads the live stream first, which bounds live latency by the job
  # ALREADY RUNNING rather than by queue depth. That is usually enough - but the job already running can
  # be a 60-minute transcription, measured at roughly 75 s, and a live chunk waiting behind one is the
  # difference between a transcript that keeps up and one that visibly stalls mid-meeting.
  #
  # Same CONSUMER_GROUP as the general worker on purpose: Redis hands each chunk to exactly one of them,
  # so whichever is free takes it and a busy general worker is simply not reading.
  #
  # NOT started by default. It holds a SECOND copy of the model weights (~9 GB working set during
  # transcription), which a card with headroom will not notice and a small one cannot afford. Start it
  # with:  docker compose --profile live-worker up -d
  live-worker:
    profiles: ["live-worker"]
    build:
      context: ../src/Diariz.Worker
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      # The whole difference from the general worker: read live chunks and nothing else.
      LIVE_ONLY: "1"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?required - set REDIS_PASSWORD (hex/alphanumeric only) in deploy/.env}@redis:6379/0"
      S3_ENDPOINT: "http://s3:8333"
      S3_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-${MINIO_APP_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_ACCESS_KEY in deploy/.env}}
      S3_SECRET_KEY: ${S3_APP_SECRET_KEY:-${MINIO_APP_SECRET_KEY:?required - run deploy/NewS3Keys.cmd (or new-s3-keys.sh) and set S3_APP_SECRET_KEY in deploy/.env}}
      S3_BUCKET: "recordings"
      API_BASE_URL: "http://api:8080"
      CALLBACK_SECRET: ${CALLBACK_SECRET:?required - set CALLBACK_SECRET in deploy/.env (shared with the worker)}
      HF_TOKEN: ${HF_TOKEN}
      DEVICE: ${WORKER_DEVICE:-cuda}
      COMPUTE_TYPE: ${WORKER_COMPUTE_TYPE:-float16}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      BATCH_SIZE: ${BATCH_SIZE:-16}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-14400}
      ENABLE_SPEAKER_EMBEDDINGS: ${ENABLE_SPEAKER_EMBEDDINGS:-1}
      SPLIT_SEGMENTS_BY_WORD_SPEAKER: ${SPLIT_SEGMENTS_BY_WORD_SPEAKER:-1}
      SPLIT_LIVE_SEGMENTS_BY_WORD_SPEAKER: ${SPLIT_LIVE_SEGMENTS_BY_WORD_SPEAKER:-0}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
    volumes:
      # The same cache volume as the general worker: the weights are identical, so this shares the
      # download rather than pulling another ~4 GB.
      - workercache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  s3data:
  workercache:
  apikeys:
  redisdata:

configs:
  # SeaweedFS identities. Inline so Compose interpolates the keys from deploy/.env; the file exists only
  # inside the s3 container (needs Compose v2.23.1+). Root administers the store; the app identity is
  # confined to `recordings` (Admin:recordings is what lets the API create its own bucket on first boot).
  # The old MINIO_* names still resolve as fallbacks, so an existing .env keeps working.
  # The observability overlay REPLACES this whole config to add a GlitchTip identity - keep the two in step.
  s3_identities:
    content: |
      {"identities":[
        {"name":"root","credentials":[{"accessKey":"${S3_ROOT_ACCESS_KEY:-${MINIO_ROOT_USER:?required - run deploy/NewS3Keys.cmd root and set S3_ROOT_ACCESS_KEY in deploy/.env}}","secretKey":"${S3_ROOT_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?required - run deploy/NewS3Keys.cmd root and set S3_ROOT_SECRET_KEY in deploy/.env}}"}],
         "actions":["Admin","Read","Write","List","Tagging"]},
        {"name":"diariz","credentials":[{"accessKey":"${S3_APP_ACCESS_KEY:-${MINIO_APP_ACCESS_KEY:?required - run deploy/NewS3Keys.cmd and set S3_APP_ACCESS_KEY in deploy/.env}}","secretKey":"${S3_APP_SECRET_KEY:-${MINIO_APP_SECRET_KEY:?required - run deploy/NewS3Keys.cmd and set S3_APP_SECRET_KEY in deploy/.env}}"}],
         "actions":["Admin:recordings","Read:recordings","Write:recordings","List:recordings","Tagging:recordings"]}
      ]}

secrets:
  # GlitchTip source-map-upload auth token (deploy/.env.example). `environment:` (not `file:`) reads it
  # straight from GLITCHTIP_TOKEN in .env, so no secret ever touches disk as its own file. Unset/blank
  # in .env still works: Compose mounts an empty secret file, and apps/web/Dockerfile's upload step
  # checks the file is non-empty (`-s`, not just `-f`) before attempting the upload.
  glitchtip_token:
    environment: GLITCHTIP_TOKEN
